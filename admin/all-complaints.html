<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Complaints — ResolveIt</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <nav class="topbar">
    <a href="../index.html" class="topbar-logo">Resolve<em>It</em></a>
    <div class="topbar-right">
      <span class="role-badge badge-admin">👨‍💼 Admin</span>
      <a href="admin-dashboard.html" class="btn btn-logout">← Dashboard</a>
    </div>
  </nav>

  <div class="page-body animate">
    <div class="section-head">
      <div>
        <h2>All Complaints</h2>
        <p style="color:var(--muted);font-size:0.85rem;margin-top:4px" id="dept-desc">All departments</p>
      </div>
      <span id="count" style="font-size:0.85rem;color:var(--muted)"></span>
    </div>

    <!-- Department filter tabs -->
    <div class="dept-tabs" id="dept-tabs">
      <button class="dept-tab active" data-dept="" onclick="setDeptTab(this,'')">All Departments</button>
    </div>

    <div class="table-wrap">
      <div class="table-filters">
        <select class="filter-select" id="filter-status" onchange="render()">
          <option value="">All Statuses</option>
          <option>Pending</option><option>In Progress</option><option>Resolved</option><option>Forwarded</option>
        </select>
        <select class="filter-select" id="filter-priority" onchange="render()">
          <option value="">All Priorities</option>
          <option>Urgent</option><option>High</option><option>Normal</option>
        </select>
        <select class="filter-select" id="filter-sort" onchange="render()">
          <option value="new">Newest First</option>
          <option value="old">Oldest First</option>
          <option value="status">By Status</option>
        </select>
      </div>
      <div id="table-body"></div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script>
    const session = getSession();
    if (!session || session.role !== 'admin') window.location.href = 'admin-login.html';

    let activeDept = '';

    // Build dept tabs
    const tabBar = document.getElementById('dept-tabs');
    getDepartments().forEach(d => {
      const btn = document.createElement('button');
      btn.className = 'dept-tab';
      btn.dataset.dept = d.id;
      btn.textContent = d.icon + ' ' + d.name;
      btn.onclick = function(){ setDeptTab(this, d.id); };
      tabBar.appendChild(btn);
    });

    function setDeptTab(btn, dept) {
      activeDept = dept;
      document.querySelectorAll('.dept-tab').forEach(b =>
        b.classList.toggle('active', b.dataset.dept === dept)
      );
      document.getElementById('dept-desc').textContent = dept
        ? getDept(dept).icon + ' ' + getDept(dept).name
        : 'All departments';
      render();
    }

    async function changeStatus(id, val) {
      const res = await apiUpdateGrievance(id, { status: val });
      if (res.ok) {
        toast('Status updated → ' + val + (val === 'Resolved' ? ' ✅ Email sent to student' : ''));
        loadAndRender();
      } else {
        toast(res.error || 'Update failed', true);
      }
    }

    async function aiSuggestReply(grievanceId) {
      toast('🤖 AI is generating a reply…');
      // Fetch full grievance from API, then ask AI
      const gRes = await apiFetch('/grievances/' + grievanceId);
      if (!gRes.ok) { toast('Could not load grievance', true); return; }
      const res = await apiFetch('/ai/suggest-reply', { method:'POST', body: JSON.stringify(gRes.data) });
      if (res.ok) {
        const reply = res.data.reply;
        showModal('🤖 AI Suggested Reply — ' + grievanceId,
          '<p style="font-size:0.9rem;color:#374151;line-height:1.7;background:#f8faff;padding:14px;border-radius:8px;border:1px solid #dbeafe;white-space:pre-wrap">' + reply + '</p>' +
          '<button class="btn btn-primary" style="margin-top:10px" onclick="navigator.clipboard.writeText(document.querySelector('#modal-body p').textContent);toast('Copied!')">Copy Reply</button>',
          null
        );
      } else {
        toast('AI unavailable — check ANTHROPIC_API_KEY in .env', true);
      }
    }

    function deleteGrievance(id) {
      showModal('Delete Grievance', 'Permanently delete ' + id + '? This cannot be undone.', async () => {
        const res = await apiFetch('/grievances/' + id, { method: 'DELETE' });
        if (res.ok) { toast('Grievance deleted.'); loadAndRender(); }
        else toast(res.error || 'Delete failed', true);
      });
    }

    let allGrievancesCache = [];

    async function loadAndRender() {
      document.getElementById('table-body').innerHTML = '<div class="empty-state"><p>Loading…</p></div>';
      const res = await apiFetch('/grievances?limit=500');
      if (!res.ok) {
        document.getElementById('table-body').innerHTML = '<div class="empty-state"><p style="color:red">⚠️ ' + (res.error || 'Session expired. Please login again.') + '</p></div>';
        return;
      }
      const payload = res.data;
      allGrievancesCache = Array.isArray(payload) ? payload : (payload.data || []);
      render();
    }

    function render() {
      const st   = document.getElementById('filter-status').value;
      const pri  = document.getElementById('filter-priority').value;
      const sort = document.getElementById('filter-sort').value;
      let list   = allGrievancesCache.filter(g =>
        (!activeDept || g.dept === activeDept) &&
        (!st  || g.status === st) &&
        (!pri || g.priority === pri)
      );
      if (sort === 'new')    list.sort((a,b) => b.date.localeCompare(a.date));
      if (sort === 'old')    list.sort((a,b) => a.date.localeCompare(b.date));
      if (sort === 'status') list.sort((a,b) => a.status.localeCompare(b.status));

      document.getElementById('count').textContent = list.length + ' record' + (list.length !== 1 ? 's' : '');

      const el = document.getElementById('table-body');
      if (!list.length) {
        el.innerHTML = `<div class="empty-state"><div class="icon">🎉</div><p>No records match your filters.</p></div>`;
        return;
      }
      el.innerHTML = `<table>
        <thead><tr>
          <th>ID</th><th>Subject</th><th>Department</th><th>Student</th><th>Priority</th><th>Date</th><th>Status</th><th>Delete</th>
        </tr></thead>
        <tbody>
          ${list.map(g => `<tr>
            <td><strong>${g.id}</strong></td>
            <td>${g.subject}</td>
            <td>${deptTag(g.dept)}</td>
            <td>${g.student}</td>
            <td><span style="font-size:0.78rem;font-weight:600;color:${g.priority==='Urgent'?'var(--red)':g.priority==='High'?'var(--amber)':'var(--muted)'}">${g.priority||'Normal'}</span></td>
            <td>${g.date}</td>
            <td>
              <select class="filter-select" style="font-size:0.78rem;padding:5px 8px" onchange="changeStatus('${g.id}',this.value)">
                ${['Pending','In Progress','Resolved','Forwarded'].map(s =>
                  `<option${g.status===s?' selected':''}>${s}</option>`
                ).join('')}
              </select>
            </td>
            <td><button class="btn-sm" onclick="aiSuggestReply('${g.id}')" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;margin-right:4px">✨ AI Reply</button><button class="btn-sm d" onclick="deleteGrievance('${g.id}')">🗑 Delete</button></td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    loadAndRender();
  </script>
</body>
</html>
