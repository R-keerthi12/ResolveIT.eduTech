<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Complaints — ResolveIt</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <nav class="topbar">
    <a href="../index.html" class="topbar-logo">Resolve<em>It</em></a>
    <div class="topbar-right">
      <span class="role-badge badge-admin">👨‍💼 Admin</span>
      <a href="admin-dashboard.html" class="btn btn-logout">← Dashboard</a>
    </div>
  </nav>

  <div class="page-body animate">
    <div class="section-head">
      <h2>All Grievances</h2>
      <span id="count-label" style="font-size:0.85rem;color:var(--muted)"></span>
    </div>

    <div class="table-wrap">
      <div class="table-filters">
        <select class="filter-select" id="filter-cat" onchange="render()">
          <option value="">All Categories</option>
          <option>Academic</option>
          <option>Hostel</option>
          <option>Technical</option>
          <option>Other</option>
        </select>
        <select class="filter-select" id="filter-status" onchange="render()">
          <option value="">All Statuses</option>
          <option>Pending</option>
          <option>In Progress</option>
          <option>Resolved</option>
          <option>Forwarded</option>
        </select>
        <select class="filter-select" id="sort-by" onchange="render()">
          <option value="date-desc">Newest First</option>
          <option value="date-asc">Oldest First</option>
          <option value="status">By Status</option>
        </select>
      </div>
      <div id="table-body"></div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script>
    const session = getSession();
    if (!session || session.role !== 'admin') window.location.href = 'admin-login.html';

    function render() {
      const cat    = document.getElementById('filter-cat').value;
      const st     = document.getElementById('filter-status').value;
      const sortBy = document.getElementById('sort-by').value;

      let list = getGrievances().filter(g =>
        (!cat || g.category === cat) &&
        (!st  || g.status   === st)
      );

      if (sortBy === 'date-desc') list.sort((a,b) => b.date.localeCompare(a.date));
      if (sortBy === 'date-asc')  list.sort((a,b) => a.date.localeCompare(b.date));
      if (sortBy === 'status')    list.sort((a,b) => a.status.localeCompare(b.status));

      document.getElementById('count-label').textContent = list.length + ' result' + (list.length!==1?'s':'');

      const el = document.getElementById('table-body');
      if (!list.length) {
        el.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>No grievances match your filters.</p></div>`;
        return;
      }
      el.innerHTML = `<table>
        <thead><tr>
          <th>ID</th><th>Subject</th><th>Category</th><th>Student</th><th>Date</th><th>Status</th><th>Action</th>
        </tr></thead>
        <tbody>
          ${list.map(g => `<tr>
            <td><strong>${g.id}</strong></td>
            <td>${g.subject}</td>
            <td>${g.category}</td>
            <td>${g.student}</td>
            <td>${g.date}</td>
            <td>${statusBadge(g.status)}</td>
            <td>
              <select class="filter-select" style="font-size:0.78rem;padding:5px 8px" onchange="changeStatus('${g.id}',this.value)">
                ${['Pending','In Progress','Resolved','Forwarded'].map(s=>`<option ${g.status===s?'selected':''}>${s}</option>`).join('')}
              </select>
              <button class="btn-sm d" onclick="deleteGrievance('${g.id}')">✕</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    function changeStatus(id, status) {
      const list = getGrievances();
      const g = list.find(x => x.id === id);
      if (g) { g.status = status; saveGrievances(list); toast('Status updated → ' + status); render(); }
    }

    function deleteGrievance(id) {
      showModal('Delete Grievance', 'Permanently delete ' + id + '? This cannot be undone.', () => {
        saveGrievances(getGrievances().filter(g => g.id !== id));
        toast('Grievance deleted');
        render();
      });
    }

    render();
  </script>
</body>
</html>
