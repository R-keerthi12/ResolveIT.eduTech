<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users — ResolveIt</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <nav class="topbar">
    <a href="../index.html" class="topbar-logo">Resolve<em>It</em></a>
    <div class="topbar-right">
      <span class="role-badge badge-admin">👨‍💼 Admin</span>
      <a href="admin-dashboard.html" class="btn btn-logout">← Dashboard</a>
    </div>
  </nav>

  <div class="page-body animate">

    <!-- Add Staff Form -->
    <div class="card" style="max-width:580px;margin-bottom:32px">
      <h2 class="page-title" style="margin-bottom:4px">Add Staff Member</h2>
      <p style="color:var(--muted);font-size:0.87rem;margin-bottom:24px">Register a new staff member to handle grievances.</p>
      <div class="field">
        <label>Full Name *</label>
        <input type="text" id="nu-name" placeholder="Dr. / Prof. Full Name">
      </div>
      <div class="field">
        <label>Email *</label>
        <input type="email" id="nu-email" placeholder="staff@college.edu">
      </div>
      <div class="field">
        <label>Department *</label>
        <select id="nu-dept">
          <option value="">— Select Department —</option>
          <option>Academic</option>
          <option>Hostel</option>
          <option>Technical</option>
          <option>Administration</option>
        </select>
      </div>
      <button class="btn btn-green btn-full" onclick="addStaff()">Add Staff Member →</button>
    </div>

    <!-- User List -->
    <div class="section-head">
      <h2>Registered Users</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" style="font-size:0.82rem;padding:6px 14px" onclick="filterUsers('all')" id="tab-all">All</button>
        <button class="btn btn-ghost" style="font-size:0.82rem;padding:6px 14px" onclick="filterUsers('staff')" id="tab-staff">Staff</button>
        <button class="btn btn-ghost" style="font-size:0.82rem;padding:6px 14px" onclick="filterUsers('student')" id="tab-student">Students</button>
      </div>
    </div>

    <div id="user-list"></div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script>
    const session = getSession();
    if (!session || session.role !== 'admin') window.location.href = 'admin-login.html';

    let activeFilter = 'all';

    function addStaff() {
      const name = document.getElementById('nu-name').value.trim();
      const email = document.getElementById('nu-email').value.trim();
      const dept  = document.getElementById('nu-dept').value;
      if (!name)  { toast('Please enter a name', true); return; }
      if (!email) { toast('Please enter an email', true); return; }
      if (!dept)  { toast('Please select a department', true); return; }

      const users = getUsers();
      if (users.find(u => u.email === email)) { toast('Email already registered', true); return; }

      users.push({ id: 'U' + Date.now(), name, email, role: 'staff', dept });
      saveUsers(users);
      toast('✅ ' + name + ' added as staff');
      document.getElementById('nu-name').value = '';
      document.getElementById('nu-email').value = '';
      document.getElementById('nu-dept').value = '';
      renderUsers();
    }

    function filterUsers(f) {
      activeFilter = f;
      renderUsers();
    }

    function removeUser(id) {
      showModal('Remove User', 'Remove this user from the system? This cannot be undone.', () => {
        saveUsers(getUsers().filter(u => u.id !== id));
        toast('User removed');
        renderUsers();
      });
    }

    function renderUsers() {
      const all = getUsers().filter(u => activeFilter === 'all' || u.role === activeFilter);
      const el  = document.getElementById('user-list');

      if (!all.length) {
        el.innerHTML = `<div class="empty-state"><div class="icon">👥</div><p>No users in this category.</p></div>`;
        return;
      }

      el.innerHTML = all.map(u => `
        <div class="user-item">
          <div class="user-avatar ${u.role==='staff' ? 'av-amber' : 'av-blue'}">${u.name[0].toUpperCase()}</div>
          <div class="user-info">
            <strong>${u.name}</strong>
            <small>${u.email}${u.dept ? ' · ' + u.dept : ''} · <em style="text-transform:capitalize">${u.role}</em></small>
          </div>
          <button class="btn-sm d" onclick="removeUser('${u.id}')">Remove</button>
        </div>
      `).join('');
    }

    renderUsers();
  </script>
</body>
</html>
