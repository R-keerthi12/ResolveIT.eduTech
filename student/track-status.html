<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Status — ResolveIt</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <nav class="topbar">
    <a href="../index.html" class="topbar-logo">Resolve<em>It</em></a>
    <div class="topbar-right">
      <span class="role-badge badge-student">🎓 Student</span>
      <a href="student-dashboard.html" class="btn btn-logout">← Dashboard</a>
    </div>
  </nav>

  <div class="page-body animate">
    <div class="section-head">
      <h2>My Complaints</h2>
    </div>

    <!-- Department filter tabs -->
    <div class="dept-tabs" id="dept-tabs">
      <button class="dept-tab active" data-dept="" onclick="setDeptTab(this,'')">All Departments</button>
    </div>

    <div class="table-wrap">
      <div class="table-filters">
        <select class="filter-select" id="filter-status" onchange="render()">
          <option value="">All Statuses</option>
          <option>Pending</option>
          <option>In Progress</option>
          <option>Resolved</option>
          <option>Forwarded</option>
        </select>
        <select class="filter-select" id="filter-priority" onchange="render()">
          <option value="">All Priorities</option>
          <option>Normal</option>
          <option>High</option>
          <option>Urgent</option>
        </select>
      </div>
      <div id="table-body"></div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script>
    const session = getSession();
    if (!session || session.role !== 'student') window.location.href = 'student-login.html';

    let activeDept = '';
    let allGrievances = [];

    function buildTabs(grievances) {
      const tabBar = document.getElementById('dept-tabs');
      const usedDepts = [...new Set(grievances.map(g => g.dept).filter(Boolean))];
      tabBar.innerHTML = '<button class="dept-tab active" data-dept="" onclick="setDeptTab(this,\'\')">All</button>';
      usedDepts.forEach(did => {
        const d = getDept(did);
        if (!d) return;
        const btn = document.createElement('button');
        btn.className = 'dept-tab';
        btn.dataset.dept = did;
        btn.textContent = d.icon + ' ' + d.name;
        btn.onclick = function(){ setDeptTab(this, did); };
        tabBar.appendChild(btn);
      });
    }

    function setDeptTab(btn, dept) {
      activeDept = dept;
      document.querySelectorAll('.dept-tab').forEach(b =>
        b.classList.toggle('active', b.dataset.dept === dept)
      );
      render();
    }

    function render() {
      const st  = document.getElementById('filter-status').value;
      const pri = document.getElementById('filter-priority').value;
      const list = allGrievances.filter(g =>
        (!activeDept || g.dept === activeDept) &&
        (!st  || g.status === st) &&
        (!pri || g.priority === pri)
      );
      const el = document.getElementById('table-body');
      if (!list.length) {
        el.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>No grievances match your filters. <a href="submit-grievance.html" style="color:var(--blue)">Submit one now →</a></p></div>`;
        return;
      }
      el.innerHTML = `<table>
        <thead><tr>
          <th>ID</th><th>Subject</th><th>Department</th><th>Priority</th><th>Date</th><th>Status</th><th>Remarks</th>
        </tr></thead>
        <tbody>
          ${list.map(g => `<tr>
            <td><strong>${g.id}</strong></td>
            <td>${g.subject}</td>
            <td>${deptTag(g.dept)}</td>
            <td><span style="font-size:0.78rem;font-weight:600;color:${g.priority==='Urgent'?'var(--red)':g.priority==='High'?'var(--amber)':'var(--muted)'}">${g.priority||'Normal'}</span></td>
            <td>${g.date}</td>
            <td>${statusBadge(g.status)}</td>
            <td style="font-size:0.8rem;color:var(--muted)">${g.remarks || '—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    async function loadGrievances() {
      document.getElementById('table-body').innerHTML = '<div class="empty-state"><p>Loading…</p></div>';
      const res = await apiFetch('/grievances?limit=500');
      allGrievances = res.ok ? (Array.isArray(res.data) ? res.data : (res.data.data || [])) : [];
      buildTabs(allGrievances);
      render();
    }
    loadGrievances();
  </script>
</body>
</html>
