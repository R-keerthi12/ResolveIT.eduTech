<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Status — ResolveIt</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <nav class="topbar">
    <a href="../index.html" class="topbar-logo">Resolve<em>It</em></a>
    <div class="topbar-right">
      <span class="role-badge badge-student">🎓 Student</span>
      <a href="student-dashboard.html" class="btn btn-logout">← Dashboard</a>
    </div>
  </nav>

  <div class="page-body animate">
    <div class="section-head">
      <h2>My Grievances</h2>
      <a href="submit-grievance.html" class="btn btn-primary" style="font-size:0.85rem;padding:8px 16px">+ New Grievance</a>
    </div>

    <div class="table-wrap">
      <div class="table-filters">
        <select class="filter-select" id="filter-status" onchange="render()">
          <option value="">All Statuses</option>
          <option>Pending</option>
          <option>In Progress</option>
          <option>Resolved</option>
          <option>Forwarded</option>
        </select>
        <select class="filter-select" id="filter-cat" onchange="render()">
          <option value="">All Categories</option>
          <option>Academic</option>
          <option>Hostel</option>
          <option>Technical</option>
          <option>Other</option>
        </select>
      </div>
      <div id="table-body"></div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script>
    const session = getSession();
    if (!session || session.role !== 'student') window.location.href = 'student-login.html';

    function render() {
      const st  = document.getElementById('filter-status').value;
      const cat = document.getElementById('filter-cat').value;
      const all = getGrievances();
      const mine = all.filter(g => g.student === session.name);
      const src  = mine.length ? mine : all; // show sample if student has none

      const filtered = src.filter(g =>
        (!st  || g.status === st) &&
        (!cat || g.category === cat)
      );

      const el = document.getElementById('table-body');
      if (!filtered.length) {
        el.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>No grievances match your filters.</p></div>`;
        return;
      }
      el.innerHTML = `<table>
        <thead><tr>
          <th>Grievance ID</th><th>Subject</th><th>Category</th><th>Date</th><th>Status</th>
        </tr></thead>
        <tbody>
          ${filtered.map(g => `<tr>
            <td><strong>${g.id}</strong></td>
            <td>${g.subject}</td>
            <td>${g.category}</td>
            <td>${g.date}</td>
            <td>${statusBadge(g.status)}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    render();
  </script>
</body>
</html>
