<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Grievance — ResolveIt</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <nav class="topbar">
    <a href="../index.html" class="topbar-logo">Resolve<em>It</em></a>
    <div class="topbar-right">
      <span class="role-badge badge-student">🎓 Student</span>
      <a href="student-dashboard.html" class="btn btn-logout">← Dashboard</a>
    </div>
  </nav>

  <div class="page-body animate">
    <div class="card" style="max-width:620px">
      <div style="margin-bottom:24px">
        <h1 class="page-title" style="margin-bottom:4px">Submit a Grievance</h1>
        <p style="color:var(--muted);font-size:0.87rem">Your complaint will be reviewed and assigned to the relevant staff member.</p>
      </div>

      <div class="field">
        <label>Grievance ID (Auto-Generated)</label>
        <input type="text" id="grv-id" readonly>
      </div>
      <div class="field">
        <label>Subject *</label>
        <input type="text" id="grv-subject" placeholder="Brief title of your issue" maxlength="100">
      </div>
      <div class="field">
        <label>Category *</label>
        <select id="grv-category">
          <option value="">— Select a category —</option>
          <option>Academic</option>
          <option>Hostel</option>
          <option>Technical</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Description *</label>
        <textarea id="grv-desc" rows="6" placeholder="Describe your issue in detail. The more information you provide, the faster we can help."></textarea>
      </div>

      <button class="btn btn-primary btn-full" onclick="doSubmit()">Submit Grievance →</button>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script>
    const session = getSession();
    if (!session || session.role !== 'student') window.location.href = 'student-login.html';

    // Set auto-generated ID on load
    document.getElementById('grv-id').value = generateID();

    function doSubmit() {
      const id      = document.getElementById('grv-id').value;
      const subject = document.getElementById('grv-subject').value.trim();
      const cat     = document.getElementById('grv-category').value;
      const desc    = document.getElementById('grv-desc').value.trim();

      if (!subject)  { toast('Please enter a subject', true); return; }
      if (!cat)      { toast('Please select a category', true); return; }
      if (!desc)     { toast('Please provide a description', true); return; }

      const grievances = getGrievances();
      grievances.push({ id, subject, category: cat, desc, status: 'Pending', date: today(), student: session.name });
      saveGrievances(grievances);

      toast('✅ Grievance ' + id + ' submitted successfully!');
      setTimeout(() => { window.location.href = 'track-status.html'; }, 900);
    }
  </script>
</body>
</html>
