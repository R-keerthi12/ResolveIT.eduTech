<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — ResolveIt</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box animate">
      <a href="../index.html" class="login-logo">Resolve<em>It</em></a>

      <span class="login-tag" style="background:var(--blue-dim);color:var(--blue)">🎓 Student Portal</span>
      <h1>Welcome back</h1>

      <div class="demo-hint">💡 Demo mode — enter any email &amp; password to continue</div>

      <div class="field">
        <label>Email / Roll Number</label>
        <input type="text" id="email" placeholder="student@college.edu" autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="pass" placeholder="••••••••">
      </div>

      <button class="btn btn-primary btn-full" onclick="doLogin()">Sign In →</button>

      <p style="text-align:center;margin-top:18px;font-size:0.85rem;color:var(--muted)">
        Not a student? <a href="../index.html" style="color:var(--blue);font-weight:500">Go back</a>
      </p>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script>
    function doLogin() {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('pass').value.trim();
      if (!email || !pass) { toast('Please fill in all fields', true); return; }

      const name = capitalise(email.split('@')[0].replace(/[._]/g, ' '));

      // Register student if not exists
      const users = getUsers();
      if (!users.find(u => u.email === email)) {
        users.push({ id: 'U' + Date.now(), name, email, role: 'student', dept: '' });
        saveUsers(users);
      }

      setSession({ name, email, role: 'student' });
      toast('Welcome, ' + name + '!');
      setTimeout(() => { window.location.href = 'student-dashboard.html'; }, 600);
    }

    // Allow Enter key
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
