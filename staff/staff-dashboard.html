<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard — ResolveIt</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <nav class="topbar">
    <a href="../index.html" class="topbar-logo">Resolve<em>It</em></a>
    <div class="topbar-right">
      <span class="role-badge badge-staff">👨‍🏫 Staff</span>
      <button class="btn btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </nav>

  <div class="page-body animate">
    <p class="page-title">Staff Dashboard</p>
    <p class="page-sub">Manage and resolve assigned grievances</p>

    <div class="stats-row" id="stats-row"></div>

    <div class="nav-grid">
      <a href="view-assigned.html" class="nav-card">
        <div class="nav-card-icon ic-blue">📋</div>
        <h3>View Assigned Complaints</h3>
        <p>Review and take action on complaints</p>
      </a>
      <a href="update-status.html" class="nav-card">
        <div class="nav-card-icon ic-amber">🔄</div>
        <h3>Update Status</h3>
        <p>Change the status of a grievance by ID</p>
      </a>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script>
    const session = getSession();
    if (!session || session.role !== 'staff') window.location.href = 'staff-login.html';

    function renderStats() {
      const g = getGrievances();
      document.getElementById('stats-row').innerHTML = `
        <div class="stat-box"><div class="stat-num">${g.length}</div><div class="stat-label">Total Assigned</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--amber)">${g.filter(x=>x.status==='Pending').length}</div><div class="stat-label">Pending</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--blue)">${g.filter(x=>x.status==='In Progress').length}</div><div class="stat-label">In Progress</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--green)">${g.filter(x=>x.status==='Resolved').length}</div><div class="stat-label">Resolved</div></div>
      `;
    }

    function doLogout() { clearSession(); window.location.href = '../index.html'; }
    renderStats();
  </script>
</body>
</html>
