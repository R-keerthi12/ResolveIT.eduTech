<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assigned Complaints — ResolveIt</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <nav class="topbar">
    <a href="../index.html" class="topbar-logo">Resolve<em>It</em></a>
    <div class="topbar-right">
      <span class="role-badge badge-staff">👨‍🏫 Staff</span>
      <a href="staff-dashboard.html" class="btn btn-logout">← Dashboard</a>
    </div>
  </nav>

  <div class="page-body animate">
    <div class="section-head">
      <h2>Assigned Complaints</h2>
    </div>

    <div class="table-wrap">
      <div class="table-filters">
        <select class="filter-select" id="filter-status" onchange="render()">
          <option value="">All Statuses</option>
          <option>Pending</option>
          <option>In Progress</option>
          <option>Resolved</option>
          <option>Forwarded</option>
        </select>
        <select class="filter-select" id="filter-cat" onchange="render()">
          <option value="">All Categories</option>
          <option>Academic</option>
          <option>Hostel</option>
          <option>Technical</option>
          <option>Other</option>
        </select>
      </div>
      <div id="table-body"></div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script>
    const session = getSession();
    if (!session || session.role !== 'staff') window.location.href = 'staff-login.html';

    function render() {
      const st  = document.getElementById('filter-status').value;
      const cat = document.getElementById('filter-cat').value;
      let list  = getGrievances().filter(g =>
        (!st  || g.status   === st)  &&
        (!cat || g.category === cat)
      );

      const el = document.getElementById('table-body');
      if (!list.length) {
        el.innerHTML = `<div class="empty-state"><div class="icon">🎉</div><p>No complaints match your filters.</p></div>`;
        return;
      }
      el.innerHTML = `<table>
        <thead><tr>
          <th>ID</th><th>Subject</th><th>Category</th><th>Student</th><th>Date</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${list.map(g => `<tr>
            <td><strong>${g.id}</strong></td>
            <td>${g.subject}</td>
            <td>${g.category}</td>
            <td>${g.student}</td>
            <td>${g.date}</td>
            <td>${statusBadge(g.status)}</td>
            <td>
              <button class="btn-sm p" onclick="setStatus('${g.id}','In Progress')">▶ Start</button>
              <button class="btn-sm s" onclick="setStatus('${g.id}','Resolved')">✓ Resolve</button>
              <button class="btn-sm w" onclick="setStatus('${g.id}','Forwarded')">⤴ Forward</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    function setStatus(id, status) {
      const list = getGrievances();
      const g = list.find(x => x.id === id);
      if (g) { g.status = status; saveGrievances(list); toast('Status updated → ' + status); render(); }
    }

    render();
  </script>
</body>
</html>
